<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekap Sertifikasi JFA 2021–2024</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --ink:#1c1c1e; --sub:#6e6e73;
    --green:#1f9d55; --green-bg:#e6f7ec;
    --red:#e0433c; --red-bg:#fdeceb;
    --amber:#e0972b; --amber-bg:#fbead2;
    --purple:#6a52d6; --purple-bg:#eeeafb;
    --track:#eceef1; --line:#e8e8ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .tabs{display:flex;background:#e5e5ea;border-radius:10px;padding:3px;gap:2px;}
  .tab{
    border:none;background:transparent;padding:7px 18px;border-radius:8px;
    font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;transition:all .15s ease;
  }
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .card{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .kpi-label{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .kpi-value{font-size:30px;font-weight:700;letter-spacing:-0.02em;}
  .kpi-value.green{color:var(--green);}
  .kpi-value.red{color:var(--red);}
  .kpi-sub{font-size:13px;font-weight:600;margin-top:4px;}
  .kpi-sub.green{color:var(--green);}
  .kpi-sub.red{color:var(--red);}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .card h2{font-size:16px;font-weight:700;margin:0 0 18px;}

  .donut-block{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .donut{position:relative;width:150px;height:150px;border-radius:50%;flex-shrink:0;}
  .donut::before{
    content:"";position:absolute;inset:20px;background:var(--card);border-radius:50%;
  }
  .donut-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-pct{font-size:24px;font-weight:800;}
  .donut-word{font-size:11px;color:var(--sub);letter-spacing:.03em;text-transform:uppercase;}
  .legend{display:flex;flex-direction:column;gap:10px;font-size:14px;}
  .legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}

  .barlist{display:flex;flex-direction:column;gap:12px;}
  .barrow{display:grid;grid-template-columns:1fr 3fr auto;align-items:center;gap:10px;font-size:13px;}
  .barrow .lbl{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .barrow .track{height:8px;background:var(--track);border-radius:4px;overflow:hidden;}
  .barrow .fill{height:100%;border-radius:4px;}
  .barrow .val{font-weight:700;text-align:right;min-width:36px;}

  .jenjang-card .barlist{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;}

  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:28px;}

  @media (max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .row2{grid-template-columns:1fr;}
    .jenjang-card .barlist{grid-template-columns:1fr;}
  }

#tabs{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rekap Pelaksanaan Sertifikasi JFA</h1>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="kpis">
    <div class="card"><div class="kpi-label">Total peserta</div><div class="kpi-value" id="k-total">–</div></div>
    <div class="card"><div class="kpi-label">Lulus</div><div class="kpi-value green" id="k-lulus">–</div><div class="kpi-sub green" id="k-lulus-pct"></div></div>
    <div class="card"><div class="kpi-label">Tidak lulus</div><div class="kpi-value red" id="k-tl">–</div><div class="kpi-sub red" id="k-tl-pct"></div></div>
    <div class="card"><div class="kpi-label">Jumlah kegiatan</div><div class="kpi-value" id="k-kegiatan">–</div></div>
  </div>

  <div class="row2">
    <div class="card">
      <h2>Distribusi hasil</h2>
      <div class="donut-block">
        <div class="donut" id="donut">
          <div class="donut-label"><div class="donut-pct" id="donut-pct">–</div><div class="donut-word">LULUS</div></div>
        </div>
        <div class="legend">
          <div><span class="dot" style="background:var(--green)"></span><span id="leg-lulus">LULUS</span></div>
          <div><span class="dot" style="background:var(--red)"></span><span id="leg-tl">TIDAK LULUS</span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Kategori sertifikasi</h2>
      <div class="barlist" id="kategori-list"></div>
    </div>
  </div>

  <div class="card jenjang-card">
    <h2>Jenjang / jabatan dituju (peserta lulus)</h2>
    <div class="barlist" id="jenjang-list"></div>
  </div>

  <footer id="footer">Rekap Pelaksanaan Sertifikasi JFA · Arsip Nasional Republik Indonesia</footer>
</div>

<script>
const DATA = {"2021": {"total": 1408, "lulus": 988, "tidak_lulus": 419, "kegiatan": 35, "kategori": [["PAD/JIKN/Akreditasi/JRA/Asesor", 1008], ["Kenaikan Jenjang Jabatan", 343], ["Perpindahan Jabatan Fungsional Umum ke Arsiparis", 11], ["Alih Jenjang Keterampilan ke Keahlian", 34], ["Perpindahan dari Jabatan Administrasi ke Arsiparis", 9], ["Jabatan Pimpinan Tinggi", 2], ["Perpindahan dari JFT lainnya ke Arsiparis", 1]], "jenjang": [["PNS L3", 395], ["Muda", 115], ["PNS L2", 113], ["Mahir", 77], ["Madya", 69], ["Penyelia", 60], ["NON PNS L3", 42], ["Penyelia-Muda", 20], ["Utama", 12], ["Mahir-Pertama", 12], ["PNS L1", 5], ["NON PNS L2", 4], ["Terampil-Pertama", 2], ["Pertama", 2], ["Terampil", 1]]}, "2022": {"total": 943, "lulus": 785, "tidak_lulus": 158, "kegiatan": 26, "kategori": [["PAD/JIKN/Akreditasi/JRA/Asesor", 533], ["Kenaikan Jenjang Jabatan", 277], ["Perpindahan Jabatan Fungsional Umum ke Arsiparis", 90], ["Alih Jenjang Keterampilan ke Keahlian", 33], ["Perpindahan dari Jabatan Administrasi ke Arsiparis", 7], ["Jabatan Pimpinan Tinggi", 2], ["Perpindahan dari JFT lainnya ke Arsiparis", 1]], "jenjang": [["PNS L3", 157], ["Muda", 118], ["Mahir", 82], ["Madya", 82], ["PNS L2", 81], ["NON PNS L3", 57], ["Penyelia", 37], ["Pertama", 23], ["Mahir-Pertama", 19], ["Penyelia-Muda", 9], ["Utama", 4], ["Terampil-Pertama", 2], ["Terampil", 2], ["PNS L1", 1], ["NON PNS L2", 1]]}, "2023": {"total": 1436, "lulus": 1123, "tidak_lulus": 313, "kegiatan": 34, "kategori": [["PAD/JIKN/Akreditasi/JRA/Asesor", 195], ["Kenaikan Jenjang Jabatan", 497], ["Perpindahan Jabatan Fungsional Umum ke Arsiparis", 622], ["Alih Jenjang Keterampilan ke Keahlian", 77], ["Perpindahan dari Jabatan Administrasi ke Arsiparis", 16], ["Jabatan Pimpinan Tinggi", 15], ["Perpindahan dari JFT lainnya ke Arsiparis", 14]], "jenjang": [["Pertama", 347], ["Madya", 185], ["Muda", 177], ["Mahir", 100], ["PNS L3", 65], ["Penyelia", 61], ["Mahir-Pertama", 46], ["NON PNS L3", 42], ["Terampil", 31], ["Penyelia-Muda", 27], ["Utama", 16], ["PNS L2", 5], ["NON PNS L2", 1]]}, "2024": {"total": 1465, "lulus": 1288, "tidak_lulus": 177, "kegiatan": 37, "kategori": [["PAD/JIKN/Akreditasi/JRA/Asesor", 354], ["Kenaikan Jenjang Jabatan", 534], ["Perpindahan Jabatan Fungsional Umum ke Arsiparis", 462], ["Alih Jenjang Keterampilan ke Keahlian", 70], ["Perpindahan dari Jabatan Administrasi ke Arsiparis", 26], ["Jabatan Pimpinan Tinggi", 3], ["Perpindahan dari JFT lainnya ke Arsiparis", 16]], "jenjang": [["Muda", 299], ["Pertama", 222], ["Madya", 220], ["PNS L3", 144], ["Mahir", 103], ["PNS L2", 93], ["NON PNS L3", 52], ["Penyelia", 51], ["Mahir-Pertama", 39], ["Terampil", 24], ["Penyelia-Muda", 15], ["Terampil-Pertama", 12], ["NON PNS L2", 8], ["Utama", 3], ["PNS L1", 3]]}};
const YEARS = ["2021","2022","2023","2024","ALL"];
const YEAR_LABEL = {2021:"2021",2022:"2022",2023:"2023",2024:"2024",ALL:"2021–2024"};

// aggregate "ALL"
(function(){
  const all = {total:0, lulus:0, tidak_lulus:0, kegiatan:0, kategori:{}, jenjang:{}};
  YEARS.slice(0,4).forEach(y=>{
    const d = DATA[y];
    all.total += d.total; all.lulus += d.lulus; all.tidak_lulus += d.tidak_lulus; all.kegiatan += d.kegiatan;
    d.kategori.forEach(([n,v])=>{ all.kategori[n]=(all.kategori[n]||0)+v; });
    d.jenjang.forEach(([n,v])=>{ all.jenjang[n]=(all.jenjang[n]||0)+v; });
  });
  all.kategori = Object.entries(all.kategori).sort((a,b)=>b[1]-a[1]);
  all.jenjang = Object.entries(all.jenjang).sort((a,b)=>b[1]-a[1]);
  DATA.ALL = all;
})();

const tabsEl = document.getElementById('tabs');
YEARS.forEach((y,i)=>{
  const b = document.createElement('button');
  b.className = 'tab' + (i===4?' active':'');
  b.textContent = YEAR_LABEL[y];
  b.dataset.year = y;
  b.onclick = ()=> render(y, b);
  tabsEl.appendChild(b);
});

function fmt(n){ return n.toLocaleString('id-ID'); }

function render(year, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const d = DATA[year];
  const total = d.total, lulus = d.lulus, tl = d.tidak_lulus;
  const pctL = total? Math.round(lulus/total*1000)/10 : 0;
  const pctT = total? Math.round(tl/total*1000)/10 : 0;

  document.getElementById('k-total').textContent = fmt(total);
  document.getElementById('k-lulus').textContent = fmt(lulus);
  document.getElementById('k-lulus-pct').textContent = pctL+'%';
  document.getElementById('k-tl').textContent = fmt(tl);
  document.getElementById('k-tl-pct').textContent = pctT+'%';
  document.getElementById('k-kegiatan').textContent = fmt(d.kegiatan);

  document.getElementById('donut').style.background =
    `conic-gradient(var(--green) 0% ${pctL}%, var(--red) ${pctL}% 100%)`;
  document.getElementById('donut-pct').textContent = pctL+'%';
  document.getElementById('leg-lulus').textContent = `LULUS (${fmt(lulus)})`;
  document.getElementById('leg-tl').textContent = `TIDAK LULUS (${fmt(tl)})`;

  const kMax = Math.max(...d.kategori.map(x=>x[1]), 1);
  document.getElementById('kategori-list').innerHTML = d.kategori.map(([name,val])=>`
    <div class="barrow">
      <div class="lbl" title="${name}">${name}</div>
      <div class="track"><div class="fill" style="width:${val/kMax*100}%;background:var(--amber);"></div></div>
      <div class="val">${fmt(val)}</div>
    </div>`).join('');

  const jMax = Math.max(...d.jenjang.map(x=>x[1]), 1);
  document.getElementById('jenjang-list').innerHTML = d.jenjang.map(([name,val])=>`
    <div class="barrow">
      <div class="lbl" title="${name}">${name}</div>
      <div class="track"><div class="fill" style="width:${val/jMax*100}%;background:var(--purple);"></div></div>
      <div class="val">${fmt(val)}</div>
    </div>`).join('');

  document.getElementById('footer').textContent =
    `Rekap Pelaksanaan Sertifikasi JFA ${YEAR_LABEL[year]} · Arsip Nasional Republik Indonesia`;
}

const requestedYear = new URLSearchParams(window.location.search).get('year');
const initialYear = DATA[requestedYear] ? requestedYear : 'ALL';
const initialButton = [...tabsEl.children].find(button => button.dataset.year === initialYear);
render(initialYear, initialButton);
</script>
</body>
</html>
